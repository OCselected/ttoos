name: Upstream release watch

# 目的：Hugo / PaperMod 上游有新版本或重要提交时，推送到 Hermes webhook，
# 由窄廊评估「值不值得为它动 ttoos 博客」，再决定是否叫醒人。
#
# 为什么不用 GitHub 原生 webhook 直连上游：
# webhook 只能挂在自己的仓库上，给 gohugoio/hugo 设 webhook 需要人家仓库的
# admin 权限。所以用本仓库的定时任务做检测器，检测到增量再 POST 出去。
#
# 需要配置的仓库 Secret：
#   HERMES_WEBHOOK_URL        https://webhook.opensourceway.blog/webhooks/upstream-release-watch
#   HERMES_WEBHOOK_SECRET     webhook_subscriptions.json 里该路由的 secret
#
# 状态文件用 Actions cache 保存，避免每天重复报同一批更新。

on:
  schedule:
    # 每天 UTC 22:10 = 北京 06:10，避开 CI 高峰
    - cron: '10 22 * * *'
  workflow_dispatch:      # 支持手动触发，便于测试

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: upstream-watch-${{ github.run_id }}
          restore-keys: |
            upstream-watch-

      - name: Check upstream releases
        id: check
        run: |
          python3 scripts/check-upstream-releases.py \
            --state .state/upstream.json \
            --out /tmp/findings.json

          HAS=$(python3 -c "import json;print('true' if json.load(open('/tmp/findings.json'))['has_update'] else 'false')")
          echo "has_update=$HAS" >> "$GITHUB_OUTPUT"
          echo "检测结果 has_update=$HAS"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: upstream-watch-${{ github.run_id }}

      - name: Notify Hermes
        if: steps.check.outputs.has_update == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "❌ 缺少 HERMES_WEBHOOK_URL / HERMES_WEBHOOK_SECRET"
            exit 1
          fi

          # 与 Hermes 路由的验签格式一致：sha256=<hex hmac>
          SIG=$(openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" /tmp/findings.json | awk '{print $2}')

          HTTP=$(curl -sS -m 30 -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: upstream_release" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data-binary @/tmp/findings.json)

          echo "webhook HTTP $HTTP"
          cat /tmp/resp.txt
          # 202 = accepted；其余视为失败，让 job 变红以便被发现
          [ "$HTTP" = "202" ] || { echo "❌ webhook 未被接受"; exit 1; }

      - name: Summary
        if: always()
        run: |
          {
            echo "## 上游版本检测"
            echo ""
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 有更新：${{ steps.check.outputs.has_update }}"
            echo ""
            if [ -f /tmp/findings.json ]; then
              echo '```json'
              head -c 3000 /tmp/findings.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
