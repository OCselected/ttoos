<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">

<style>

text { font-family: "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
.title { font-size: 28px; font-weight: 700; fill: #E8DCC8; letter-spacing: 0.5px; }
.subtitle { font-size: 15px; fill: #A89070; font-style: italic; }
.label { font-size: 16px; fill: #E8DCC8; }
.small { font-size: 13px; fill: #A89070; }
.mono { font-family: "Noto Sans CJK SC", "DejaVu Sans Mono", monospace; font-size: 12px; fill: #B8B0A0; }
.dark-bg { fill: #1A1612; }
.panel { fill: #221D17; stroke: #3A3228; stroke-width: 1.2; }
.panel-accent { fill: #2A2218; stroke: #B4A078; stroke-width: 1.5; }
.gold-line { stroke: #B4A078; stroke-width: 1.5; fill: none; }
.dim-line { stroke: #5A4E3E; stroke-width: 1; fill: none; }
.gold-fill { fill: #B4A078; }
.dim-fill { fill: #3A3228; }
.accent-fill { fill: #C9A050; }
.divider { stroke: #3A3228; stroke-width: 1; fill: none; }
.connector { stroke: #B4A078; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.connector-dim { stroke: #5A4E3E; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#B4A078"/>
</marker>
<marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#5A4E3E"/>
</marker>
</defs>

<rect class="dark-bg" width="1200" height="700"/>

<line class="gold-line" x1="60" y1="30" x2="1140" y2="30"/>
<text class="title" x="60" y="70">Karen Copenhaver：制度翻译者</text>
<text class="subtitle" x="60" y="96">从 Copyleft 哲学到可审计的商业义务</text>

<!-- 左：传统开源律师 -->
<g>
  <rect class="panel" x="60" y="130" width="500" height="420" rx="6"/>
  <text class="label" x="80" y="165" font-weight="700" font-size="18">传统开源律师</text>
  <text class="mono" x="80" y="185">Eben Moglen / FSF in-house</text>
  <line class="dim-line" x1="80" y1="198" x2="540" y2="198"/>

  <text class="small" x="80" y="230" fill="#A89070">服务对象</text>
  <text class="label" x="200" y="230">社区 / 权利人</text>

  <text class="small" x="80" y="275" fill="#A89070">话语体系</text>
  <text class="label" x="200" y="275">哲学（Copyleft、自由、精神）</text>

  <text class="small" x="80" y="320" fill="#A89070">制度功能</text>
  <text class="label" x="200" y="320">制度守护者</text>

  <text class="small" x="80" y="365" fill="#A89070">与市场关系</text>
  <text class="label" x="200" y="365">外生于市场（社区内部）</text>

  <text class="small" x="80" y="410" fill="#A89070">知识生产</text>
  <text class="label" x="200" y="410">法理学（GPL 作为合同的有效性）</text>

  <line class="dim-line" x1="80" y1="455" x2="540" y2="455"/>
  <text class="small" x="80" y="485" fill="#C9A050">核心立场</text>
  <text class="label" x="80" y="510">"GPL 是权利人的契约自由"</text>
  <text class="small" x="80" y="530" fill="#A89070">→ 制度从"权利人"一方出发</text>
</g>

<!-- 中间分隔 -->
<line class="dim-line" x1="570" y1="130" x2="570" y2="550"/>
<text class="mono" x="585" y="290" fill="#B4A078" font-weight="700">VS</text>
<text class="mono" x="585" y="310" fill="#B4A078" font-size="10" style="font-family: Noto Sans CJK SC">翻译</text>

<!-- 右：Karen Copenhaver -->
<g>
  <rect class="panel-accent" x="600" y="130" width="540" height="420" rx="6"/>
  <text class="label" x="620" y="165" font-weight="700" font-size="18" fill="#C9A050">Karen Copenhaver</text>
  <text class="mono" x="620" y="185">IBM (1979–) → Black Duck → Linux Foundation</text>
  <line class="gold-line" x1="620" y1="198" x2="1120" y2="198"/>

  <text class="small" x="620" y="230" fill="#A89070">服务对象</text>
  <text class="label" x="760" y="230">企业法务部门</text>

  <text class="small" x="620" y="275" fill="#A89070">话语体系</text>
  <text class="label" x="760" y="275">风险（诉讼概率、和解金、源代码成本）</text>

  <text class="small" x="620" y="320" fill="#A89070">制度功能</text>
  <text class="label" x="760" y="320" fill="#C9A050">制度翻译者</text>

  <text class="small" x="620" y="365" fill="#A89070">与市场关系</text>
  <text class="label" x="760" y="365">内生于市场（企业供应链）</text>

  <text class="small" x="620" y="410" fill="#A89070">知识生产</text>
  <text class="label" x="760" y="410">工程学（如何审计代码库中的 GPL）</text>

  <line class="gold-line" x1="620" y1="455" x2="1120" y2="455"/>
  <text class="small" x="620" y="485" fill="#C9A050">核心立场</text>
  <text class="label" x="620" y="510">"先赢得正确的心和思维，再制定方案"</text>
  <text class="small" x="620" y="530" fill="#A89070">→ 制度从"使用者"一方出发</text>
</g>

<text class="mono" x="60" y="640">"avoid mandating a course of action advocated by lawyers alone" — Copenhaver, OSDL 2005</text>
<text class="mono" x="1140" y="680" text-anchor="end" fill="#6A5E4E">discursive institutionalism</text>
</svg>
