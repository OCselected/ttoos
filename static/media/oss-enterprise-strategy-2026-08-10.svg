<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>

<!-- right decorative nested circles (top) -->
<circle cx="525" cy="120" r="150" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.05"/>
<circle cx="535" cy="130" r="100" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.07"/>
<circle cx="542" cy="138" r="50" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.09"/>
<circle cx="548" cy="144" r="22" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>

<!-- OSPO 4-stage ascending bars (defensive -> offensive) bottom-right -->
<rect x="445" y="620" width="24" height="18" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.22"/>
<rect x="475" y="595" width="24" height="43" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.28"/>
<rect x="505" y="565" width="24" height="73" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.35"/>
<rect x="535" y="525" width="24" height="113" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.45"/>
<!-- ascending arrow line -->
<path d="M 440 640 L 565 525" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.20"/>

<!-- rotated small squares -->
<rect x="465" y="705" width="18" height="18" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.14" transform="rotate(45, 474, 714)"/>
<rect x="535" y="710" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.16" transform="rotate(45, 542, 717)"/>
<rect x="435" y="740" width="10" height="10" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.18" transform="rotate(45, 440, 745)"/>

<!-- scattered dots -->
<circle cx="425" cy="250" r="3" fill="#1B3B6B" opacity="0.12"/>
<circle cx="460" cy="330" r="2.5" fill="#1B3B6B" opacity="0.10"/>
<circle cx="495" cy="395" r="3.5" fill="#1B3B6B" opacity="0.11"/>
<circle cx="435" cy="470" r="2.5" fill="#1B3B6B" opacity="0.13"/>
<circle cx="575" cy="240" r="3" fill="#1B3B6B" opacity="0.10"/>
<circle cx="500" cy="470" r="2.5" fill="#1B3B6B" opacity="0.11"/>

<!-- BOOK tag -->
<rect x="40" y="72" width="130" height="22" rx="3" fill="#1B3B6B"/>
<text x="105" y="87" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-10</text>

<!-- Title (Chinese) -->
<text x="40" y="130" font-family="Noto Serif CJK SC, Songti SC, Georgia, serif" font-size="20" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">OSSビジネス活用</tspan>
</text>
<text x="40" y="165" font-family="Noto Serif CJK SC, Songti SC, Georgia, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">「守り」</tspan>
</text>
<text x="40" y="195" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#555555" letter-spacing="3">
  <tspan x="40" dy="0">&amp;&amp;</tspan>
</text>
<text x="40" y="225" font-family="Noto Serif CJK SC, Songti SC, Georgia, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">「攻め」</tspan>
</text>
<text x="40" y="260" font-family="Noto Serif CJK SC, Songti SC, Georgia, serif" font-size="16" font-weight="700" fill="#1B3B6B">
  <tspan x="40" dy="0">實踐的 OSPO 戰略</tspan>
</text>

<text x="40" y="290" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">
  <tspan x="40" dy="0">中村雄一 · 桑田昌行 · 渡邊歩 · 福安徳晃</tspan>
  <tspan x="40" dy="16">日經書店 / 2026.07</tspan>
</text>

<line x1="40" y1="322" x2="290" y2="322" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<text x="40" y="345" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">日立 OSPO 首長中村雄一與索尼 OSPO 負責人</tspan>
  <tspan x="40" dy="18">桑田昌行聯手執筆，把 OSPO 從「合規部門」</tspan>
  <tspan x="40" dy="18">重塑為「戰略資產管理中心」。防守（許可證、</tspan>
  <tspan x="40" dy="18">安全、SBOM）＋進攻（貢獻、標準、生態、</tspan>
  <tspan x="40" dy="18">影響力），四階段成熟度模型一步一登——</tspan>
  <tspan x="40" dy="18">不跳層、不僥倖，是戰略也是紀律。</tspan>
</text>

<rect x="40" y="495" width="95" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="87" y="508" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="527" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 防守 = 可見性，不是合規</tspan>
  <tspan x="40" dy="17">• 進攻 = 參與者創造技術規則</tspan>
  <tspan x="40" dy="17">• OSPO 四階段：消費者 → 參與者 → 貢獻者 → 領導者</tspan>
</text>

<!-- Right vertical quote -->
<text x="540" y="450" text-anchor="middle" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" font-style="italic" fill="#1B3B6B" opacity="0.45" letter-spacing="0.5">
  <tspan x="540" dy="0">只能一段</tspan>
  <tspan x="540" dy="13">一段往上</tspan>
  <tspan x="540" dy="13">登。</tspan>
  <tspan x="540" dy="13">手段只有</tspan>
  <tspan x="540" dy="13">持續的參</tspan>
  <tspan x="540" dy="13">與與貢獻。</tspan>
</text>
<text x="540" y="580" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="7" fill="#1B3B6B" opacity="0.35">— 中村雄一 · 監修</text>

<rect x="420" y="760" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="775" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之道·荐书</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
