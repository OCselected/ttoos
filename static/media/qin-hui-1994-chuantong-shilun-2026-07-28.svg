<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>

<!-- ===== 左侧内容区 (0-390) ===== -->

<rect x="30" y="65" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="66" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>

<text x="30" y="125" font-family="Songti SC, Noto Serif CJK SC, STSong, serif" font-size="28" font-weight="900" fill="#1A1A1A">
  <tspan x="30" dy="0">传统十论</tspan>
</text>
<text x="30" y="175" font-family="Songti SC, Noto Serif CJK SC, STSong, serif" font-size="18" font-weight="600" fill="#1A1A1A">
  <tspan x="30" dy="0">乡土社会与传统文化</tspan>
</text>
<text x="30" y="223" font-family="Georgia, Songti SC, serif" font-size="16" fill="#555555" font-style="italic">
  <tspan x="30" dy="0">Traditional Ten Essays</tspan>
</text>

<text x="30" y="263" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">秦晖 · 上海人民出版社 · 1994</text>

<line x1="30" y1="287" x2="212" y2="287" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<text x="30" y="312" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">秦晖以"十论"为纲，用制度经济学</tspan>
  <tspan x="30" dy="19">与人类学双重视角，系统解剖中国乡</tspan>
  <tspan x="30" dy="19">土社会的制度与文化逻辑。"传统"并</tspan>
  <tspan x="30" dy="19">不是铁板一块，而是可以被拆解、可</tspan>
  <tspan x="30" dy="19">以被重新组装的概念——关键不在</tspan>
  <tspan x="30" dy="19">情绪批判，而在冷静对照。</tspan>
</text>

<rect x="30" y="449" width="72" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="66" y="462" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="30" y="490" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">• 没有对照系就无法认识自己</tspan>
  <tspan x="30" dy="18">• 文化折光</tspan>
  <tspan x="30" dy="18">• 无差别专制</tspan>
</text>

