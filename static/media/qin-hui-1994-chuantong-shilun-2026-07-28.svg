<circle cx="490" cy="200" r="25" fill="#1B3B6B" opacity="0.04"/>

<rect x="430" y="320" width="8" height="8" fill="#1B3B6B" opacity="0.08" transform="rotate(45, 434, 324)"/>
<rect x="450" y="340" width="6" height="6" fill="#1B3B6B" opacity="0.06" transform="rotate(45, 453, 343)"/>
<rect x="470" y="310" width="10" height="10" fill="#1B3B6B" opacity="0.05" transform="rotate(45, 475, 315)"/>

<text x="415" y="428" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="440" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#555555">
  <tspan x="415" dy="0">没有对照系</tspan>
  <tspan x="415" dy="16">就无法认识</tspan>
  <tspan x="415" dy="16">自己</tspan>
</text>
<text x="415" y="498" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="510" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="7" fill="#555555">
  <tspan x="415" dy="0">— 秦晖 对照系方法论</tspan>
</text>

