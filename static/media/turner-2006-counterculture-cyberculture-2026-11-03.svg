<circle cx="470" cy="395" r="2" fill="#1B3B6B" opacity="0.09"/>
<rect x="40" y="70" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="76" y="85" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-11-03</text>
<text x="40" y="110" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="28" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">From</tspan>
  <tspan x="40" dy="36">Counterculture</tspan>
  <tspan x="40" dy="36">to Cyberculture</tspan>
</text>
<text x="40" y="258" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Fred Turner (2006)</text>
<line x1="40" y1="286" x2="222" y2="286" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="308" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">1960 年代，计算机是冷战的管控工具；</tspan>
  <tspan x="40" dy="20">1990 年代，它成了个人解放的象征。</tspan>
  <tspan x="40" dy="20">Turner 追踪斯图尔特·布兰德与「全球</tspan>
  <tspan x="40" dy="20">网络」三十年：目录、WELL、《连线》。</tspan>
  <tspan x="40" dy="20">一套解放语法如何被说出来，又如何</tspan>
  <tspan x="40" dy="20">被新经济的话语平稳接管。</tspan>
</text>
<rect x="40" y="456" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="469" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="495" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 新共同体主义：冷战的另一半血统</tspan>
  <tspan x="40" dy="18">• 经纪人如何生产「网络＝社区＝自由」</tspan>
  <tspan x="40" dy="18">• 解放话语被商业语法接管的路径</tspan>
</text>
<text x="465" y="525" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" fill="#1B3B6B" opacity="0.40">
  <tspan x="465" dy="0">意</tspan>
  <tspan x="465" dy="11">义</tspan>
  <tspan x="465" dy="11">先</tspan>
  <tspan x="465" dy="11">于</tspan>
  <tspan x="465" dy="11">规</tspan>
  <tspan x="465" dy="11">则</tspan>
</text>
<text x="465" y="660" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="8" fill="#1B3B6B" opacity="0.30">— Fred Turner</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OPEN SOURCE · 荐书</text>
<text x="40" y="757" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#B4A078">开源之道 · 适兕 × 窄廊</text>
</svg>
