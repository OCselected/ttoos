<rect x="40" y="65" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-18</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Governing the</tspan>
  <tspan x="40" dy="34">Commons: The</tspan>
  <tspan x="40" dy="34">Evolution of</tspan>
  <tspan x="40" dy="34">Institutions for</tspan>
  <tspan x="40" dy="34">Collective Action</tspan>
</text>
<text x="40" y="285" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Elinor Ostrom (1990)</text>
<line x1="40" y1="313" x2="222" y2="313" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="335" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">当Hardin的公地悲剧被奉为铁律时，Ostr</tspan>
  <tspan x="40" dy="20">om用全球500+个案例的实证研究证明：人</tspan>
  <tspan x="40" dy="20">类可以通过自组织设计制度，有效管理公</tspan>
  <tspan x="40" dy="20">共资源而不依赖私有化或国家干预。这部</tspan>
  <tspan x="40" dy="20">1990年出版、2009年为她赢得诺贝尔经济</tspan>
  <tspan x="40" dy="20">学奖的经典，为开源社区的治理困境提供</tspan>
  <tspan x="40" dy="20">了最根本的分析框架。</tspan>
</text>
<rect x="40" y="497" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="510" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="525" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 公地资源与集体行动</tspan>
  <tspan x="40" dy="18">• 多中心治理</tspan>
  <tspan x="40" dy="18">• 八项设计原则</tspan>
</text>
