  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<circle cx="540" cy="125" r="155" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.05"/>
<circle cx="555" cy="140" r="100" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.07"/>
<circle cx="560" cy="145" r="50" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.09"/>
<circle cx="562" cy="148" r="20" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.11"/>
<rect x="498" y="555" width="22" height="22" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.12" transform="rotate(45, 509, 566)"/>
<rect x="532" y="595" width="16" height="16" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.14" transform="rotate(45, 540, 603)"/>
<rect x="468" y="618" width="11" height="11" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.16" transform="rotate(45, 473, 623)"/>
<circle cx="422" cy="215" r="3" fill="#1B3B6B" opacity="0.12"/>
<circle cx="452" cy="315" r="2.5" fill="#1B3B6B" opacity="0.10"/>
<circle cx="492" cy="385" r="3.5" fill="#1B3B6B" opacity="0.11"/>
<circle cx="438" cy="455" r="2.5" fill="#1B3B6B" opacity="0.13"/>
<circle cx="578" cy="245" r="3" fill="#1B3B6B" opacity="0.10"/>
<rect x="40" y="72" width="130" height="22" rx="3" fill="#1B3B6B"/>
<text x="105" y="87" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-05</text>
<text x="40" y="108" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="21" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">The Economic</tspan>
  <tspan x="40" dy="27">Institutions of</tspan>
  <tspan x="40" dy="27">Capitalism</tspan>
</text>
<text x="40" y="223" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Oliver E. Williamson (1985)</text>
<line x1="40" y1="248" x2="290" y2="248" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="270" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">威廉姆森以"交易成本经济学"为</tspan>
  <tspan x="40" dy="18">核心，提出治理结构的四层框架——</tspan>
  <tspan x="40" dy="18">从市场到科层制，制度选择的关键不</tspan>
  <tspan x="40" dy="18">是规模，而是资产专用性、频率与</tspan>
  <tspan x="40" dy="18">不确定性。这一"治理层级"的分析</tspan>
  <tspan x="40" dy="18">工具，恰好能用来解剖开源社区</tspan>
  <tspan x="40" dy="18">的治理结构为何与科层制格格不入。</tspan>
</text>
<rect x="40" y="460" width="95" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="87" y="473" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="498" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 交易成本经济学</tspan>
  <tspan x="40" dy="17">• 治理层级 L1–L4 框架</tspan>
  <tspan x="40" dy="17">• 资产专用性 / 频率 / 不确定性</tspan>
</text>
<text x="540" y="435" text-anchor="middle" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" font-style="italic" fill="#1B3B6B" opacity="0.45" letter-spacing="0.5">
  <tspan x="540" dy="0">治理结构的</tspan>
  <tspan x="540" dy="13">选择，</tspan>
  <tspan x="540" dy="13">取决于</tspan>
  <tspan x="540" dy="13">交易的</tspan>
  <tspan x="540" dy="13">性质——</tspan>
  <tspan x="540" dy="13">而非组织</tspan>
  <tspan x="540" dy="13">的偏好。</tspan>
</text>
<text x="540" y="545" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="7" fill="#1B3B6B" opacity="0.35">— Williamson</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之道·荐书</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
