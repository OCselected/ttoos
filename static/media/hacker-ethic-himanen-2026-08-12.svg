<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>

<!-- right geometric decoration: spirit of information age -->
<circle cx="500" cy="140" r="180" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.05"/>
<circle cx="510" cy="150" r="120" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.07"/>
<circle cx="520" cy="158" r="68" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.09"/>

<!-- radiating passion motifs -->
<g stroke="#1B3B6B" stroke-width="1" fill="#1B3B6B" opacity="0.14">
  <circle cx="430" cy="290" r="4" fill="#1B3B6B"/>
  <circle cx="490" cy="330" r="3.5" fill="#1B3B6B"/>
  <circle cx="560" cy="295" r="3" fill="#1B3B6B"/>
  <circle cx="470" cy="370" r="3" fill="#1B3B6B"/>
  <circle cx="540" cy="400" r="3.5" fill="#1B3B6B"/>
  <circle cx="425" cy="455" r="3" fill="#1B3B6B"/>
  <circle cx="495" cy="485" r="4" fill="#1B3B6B"/>
  <line x1="430" y1="290" x2="490" y2="330" stroke-width="0.8"/>
  <line x1="490" y1="330" x2="560" y2="295" stroke-width="0.8"/>
  <line x1="430" y1="290" x2="470" y2="370" stroke-width="0.8"/>
  <line x1="470" y1="370" x2="540" y2="400" stroke-width="0.8"/>
  <line x1="470" y1="370" x2="425" y2="455" stroke-width="0.8"/>
  <line x1="425" y1="455" x2="495" y2="485" stroke-width="0.8"/>
</g>

<circle cx="465" cy="600" r="22" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.06"/>
<circle cx="485" cy="615" r="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<rect x="445" y="650" width="18" height="18" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.12" transform="rotate(45, 454, 659)"/>
<rect x="500" y="655" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.14" transform="rotate(45, 507, 662)"/>
<rect x="410" y="680" width="10" height="10" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.16" transform="rotate(45, 415, 685)"/>

<circle cx="425" cy="230" r="3" fill="#1B3B6B" opacity="0.12"/>
<circle cx="575" cy="240" r="3" fill="#1B3B6B" opacity="0.10"/>
<circle cx="430" cy="700" r="2.5" fill="#1B3B6B" opacity="0.13"/>

<rect x="40" y="72" width="130" height="22" rx="3" fill="#1B3B6B"/>
<text x="105" y="87" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-12</text>

<text x="40" y="107" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="23" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">The Hacker</tspan>
  <tspan x="40" dy="28">Ethic</tspan>
</text>
<text x="40" y="215" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="11" fill="#555555">Pekka Himanen (2001)</text>
<line x1="40" y1="238" x2="290" y2="238" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<text x="40" y="260" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">当新教伦理为工业时代奠基，海曼</tspan>
  <tspan x="40" dy="18">追问：谁为信息时代提供伦理？他</tspan>
  <tspan x="40" dy="18">提出黑客伦理——激情、自由、共</tspan>
  <tspan x="40" dy="18">享——不是对资本主义的反叛，而</tspan>
  <tspan x="40" dy="18">是一种替代性的工作哲学：以创造</tspan>
  <tspan x="40" dy="18">本身为回报，以共享为协作的元规则。</tspan>
</text>

<rect x="40" y="442" width="95" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="87" y="455" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="470" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 黑客伦理 vs 新教伦理</tspan>
  <tspan x="40" dy="17">• 激情作为劳动动机</tspan>
  <tspan x="40" dy="17">• 共享作为信息时代美德</tspan>
</text>

<text x="540" y="440" text-anchor="middle" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" font-style="italic" fill="#1B3B6B" opacity="0.45" letter-spacing="0.5">
  <tspan x="540" dy="0">信息时代的</tspan>
  <tspan x="540" dy="13">工作不应</tspan>
  <tspan x="540" dy="13">以赚钱为</tspan>
  <tspan x="540" dy="13">唯一目的，</tspan>
  <tspan x="540" dy="13">而以创造为</tspan>
  <tspan x="540" dy="13">最高回报。</tspan>
</text>
<text x="540" y="580" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="7" fill="#1B3B6B" opacity="0.35">— Himanen · 适兕注</text>

<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之道·荐书</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
