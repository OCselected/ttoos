<circle cx="560" cy="40" r="80" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.10"/>
<rect x="20" y="90" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="2" opacity="0.10" transform="rotate(15, 27, 97)"/>
