<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">PAPER</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-17</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">The Emergence of an</tspan>
  <tspan x="40" dy="34">Organizational</tspan>
  <tspan x="40" dy="34">Field: The Case of</tspan>
  <tspan x="40" dy="34">Open Source Software</tspan>
</text>
<text x="40" y="251" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Abhoy K. Ojha &amp; Ravi Anand Rao (2014)</text>
<line x1="40" y1="279" x2="222" y2="279" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="301" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">Ojha &amp; Rao</tspan>
  <tspan x="40" dy="20">运用制度理论（Institutional</tspan>
  <tspan x="40" dy="20">Theory）考察开源软件如何从一个边缘的</tspan>
  <tspan x="40" dy="20">技术实践者社群，逐步涌现为一个独立、</tspan>
  <tspan x="40" dy="20">自洽的组织场域。论文以结构化（struct</tspan>
  <tspan x="40" dy="20">uration）框架分析了开源场域从萌芽到</tspan>
  <tspan x="40" dy="20">制度化的三阶段演化过程。</tspan>
</text>
<rect x="40" y="463" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="476" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="491" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 组织场域涌现</tspan>
  <tspan x="40" dy="18">• 制度理论</tspan>
  <tspan x="40" dy="18">• 开源软件场域</tspan>
</text>
