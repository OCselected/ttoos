<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<circle cx="540" cy="120" r="160" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.05"/>
<circle cx="555" cy="135" r="105" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.07"/>
<circle cx="560" cy="140" r="55" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.09"/>
<rect x="500" y="560" width="20" height="20" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.12" transform="rotate(45, 510, 570)"/>
<rect x="535" y="595" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.14" transform="rotate(45, 542, 602)"/>
<rect x="470" y="615" width="10" height="10" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.16" transform="rotate(45, 475, 620)"/>
<circle cx="425" cy="220" r="3" fill="#1B3B6B" opacity="0.12"/>
<circle cx="455" cy="320" r="2.5" fill="#1B3B6B" opacity="0.10"/>
<circle cx="490" cy="390" r="3.5" fill="#1B3B6B" opacity="0.11"/>
<circle cx="440" cy="450" r="2.5" fill="#1B3B6B" opacity="0.13"/>
<circle cx="575" cy="250" r="3" fill="#1B3B6B" opacity="0.10"/>
<rect x="40" y="72" width="130" height="22" rx="3" fill="#1B3B6B"/>
<text x="105" y="87" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-04</text>
<text x="40" y="107" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="24" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Economic Behavior</tspan>
  <tspan x="40" dy="30">and Institutions</tspan>
</text>
<text x="40" y="205" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Thrainn Eggertsson (1990)</text>
<line x1="40" y1="230" x2="290" y2="230" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="252" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">制度不是外在于人的"规则"，而是人</tspan>
  <tspan x="40" dy="18">在经济行为中不断重复、学习和重塑的</tspan>
  <tspan x="40" dy="18">结果。艾格特森用演化视角把新制度</tspan>
  <tspan x="40" dy="18">经济学从"静态均衡"带向"动态过程"——</tspan>
  <tspan x="40" dy="18">这一洞见，正是理解开源制度如何</tspan>
  <tspan x="40" dy="18">在协作中自发生长的理论基石。</tspan>
</text>
<rect x="40" y="432" width="95" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="87" y="445" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="460" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 制度内生于经济行为</tspan>
  <tspan x="40" dy="17">• 惯例、习惯与学习机制</tspan>
  <tspan x="40" dy="17">• 路径依赖与制度变迁</tspan>
</text>
<text x="540" y="430" text-anchor="middle" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" font-style="italic" fill="#1B3B6B" opacity="0.45" letter-spacing="0.5">
  <tspan x="540" dy="0">制度不是</tspan>
  <tspan x="540" dy="13">给定之物，</tspan>
  <tspan x="540" dy="13">而是被</tspan>
  <tspan x="540" dy="13">行为不断</tspan>
  <tspan x="540" dy="13">重写的</tspan>
  <tspan x="540" dy="13">过程。</tspan>
</text>
<text x="540" y="540" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="7" fill="#1B3B6B" opacity="0.35">— Eggertsson</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之道·荐书</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
