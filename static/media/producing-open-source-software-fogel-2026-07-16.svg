  <tspan x="40" dy="34">Source Software: How</tspan>
  <tspan x="40" dy="34">to Run a Successful</tspan>
  <tspan x="40" dy="34">Free Software</tspan>
  <tspan x="40" dy="34">Project</tspan>
</text>
<text x="40" y="285" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Karl Fogel (2005)</text>
<line x1="40" y1="313" x2="222" y2="313" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="335" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">Karl Fogel 的《Producing Open Source</tspan>
  <tspan x="40" dy="20">Software》是开源项目管理领域的「圣经</tspan>
  <tspan x="40" dy="20">」。作为 Subversion</tspan>
  <tspan x="40" dy="20">核心开发者，Fogel</tspan>
  <tspan x="40" dy="20">将他在开源社区治理中的实践经验提炼为</tspan>
