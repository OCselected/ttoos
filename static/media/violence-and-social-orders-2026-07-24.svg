<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1F4E79"/>
<circle cx="550" cy="50" r="130" fill="none" stroke="#1F4E79" stroke-width="1.5" opacity="0.07"/>
<circle cx="560" cy="40" r="80" fill="none" stroke="#1F4E79" stroke-width="1" opacity="0.10"/>
<rect x="20" y="90" width="14" height="14" fill="none" stroke="#1F4E79" stroke-width="2" opacity="0.10" transform="rotate(15, 27, 97)"/>
<rect x="40" y="65" width="72" height="22" rx="3" fill="#1F4E79"/>
<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-24</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="24" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Violence and</tspan>
  <tspan x="40" dy="32">Social Orders:</tspan>
  <tspan x="40" dy="32">A Conceptual</tspan>
  <tspan x="40" dy="32">Framework for</tspan>
  <tspan x="40" dy="32">Interpreting</tspan>
  <tspan x="40" dy="32">Recorded History</tspan>
</text>
<text x="40" y="285" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">D. C. North, J. J. Wallis &amp; B. R. Weingast (2009)</text>
<line x1="40" y1="313" x2="295" y2="313" stroke="#1F4E79" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="335" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">社会的繁荣取决于如何组织对暴力的控制——</tspan>
  <tspan x="40" dy="20">精英集团通过「有限准入」维持特权，真正的</tspan>
  <tspan x="40" dy="20">开放需要经济、政治、军事三领域同时开放。</tspan>
  <tspan x="40" dy="20">这一框架，为理解开源协作的制度逻辑</tspan>
  <tspan x="40" dy="20">提供了宏大的历史纵深。</tspan>
</text>
<rect x="40" y="477" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="490" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="505" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 暴力（权力）控制的制度安排</tspan>
  <tspan x="40" dy="18">• 有限准入 vs 开放准入秩序</tspan>
  <tspan x="40" dy="18">• 经济—政治—军事同步开放</tspan>
  <tspan x="40" dy="18">• 路径依赖与制度变迁</tspan>
</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1F4E79" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1F4E79" opacity="0.35">OSCAR · 开源之书·共读</text>
<rect x="0" y="796" width="600" height="4" fill="#1F4E79" opacity="0.7"/>
</svg>
