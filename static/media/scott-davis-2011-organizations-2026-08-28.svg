<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#7A3B1B"/>
<circle cx="550" cy="50" r="130" fill="none" stroke="#7A3B1B" stroke-width="1.5" opacity="0.07"/>
<circle cx="560" cy="40" r="80" fill="none" stroke="#7A3B1B" stroke-width="1" opacity="0.10"/>
<rect x="20" y="90" width="14" height="14" fill="none" stroke="#7A3B1B" stroke-width="2" opacity="0.10" transform="rotate(15, 27, 97)"/>
<rect x="40" y="65" width="72" height="22" rx="3" fill="#7A3B1B"/>
<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-28</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="24" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Organizations:</tspan>
  <tspan x="40" dy="32">Rational, Natural,</tspan>
  <tspan x="40" dy="32">and Open Systems</tspan>
  <tspan x="40" dy="32">Perspectives</tspan>
</text>
<text x="40" y="280" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">W. Richard Scott &amp; Gerald F. Davis (2011)</text>
<line x1="40" y1="308" x2="240" y2="308" stroke="#7A3B1B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="330" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">组织为什么存在？为什么采取某种结构？</tspan>
  <tspan x="40" dy="20">为什么被社会接纳？Scott 的三个视角——</tspan>
  <tspan x="40" dy="20">理性、自然、开放——提供了理解任何</tspan>
  <tspan x="40" dy="20">组织的坐标系。对开源而言，这本书不是</tspan>
  <tspan x="40" dy="20">内容本身，而是看开源的"视角的视角"</tspan>
  <tspan x="40" dy="20">——它让适兕的整张制度分析地图有了</tspan>
  <tspan x="40" dy="20">方法论骨架。</tspan>
</text>
<rect x="40" y="492" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="505" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="520" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 理性系统 / 效率</tspan>
  <tspan x="40" dy="18">• 自然系统 / 冲突</tspan>
  <tspan x="40" dy="18">• 开放系统 / 合法性</tspan>
</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#7A3B1B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#7A3B1B" opacity="0.35">OSCAR · 开源之书·共读</text>
<rect x="0" y="796" width="600" height="4" fill="#7A3B1B" opacity="0.7"/>
</svg>
