</text>
<text x="415" y="452" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#555555">
  <tspan x="415" dy="0">独</tspan>
  <tspan x="415" dy="16">立</tspan>
  <tspan x="415" dy="16">性</tspan>
  <tspan x="415" dy="16">、</tspan>
  <tspan x="415" dy="16">多</tspan>
  <tspan x="415" dy="16">样</tspan>
  <tspan x="415" dy="16">性</tspan>
  <tspan x="415" dy="16">、</tspan>
  <tspan x="415" dy="16">去</tspan>
  <tspan x="415" dy="16">中</tspan>
