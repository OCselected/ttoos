</text>

<rect x="415" y="700" width="150" height="28" rx="2" fill="none" stroke="#1B3B6B" stroke-width="0.5" opacity="0.4"/>
<text x="490" y="718" text-anchor="middle" font-family="Songti SC, Noto Serif CJK SC, STSong, serif" font-size="10" fill="#1B3B6B" opacity="0.7">「开源之道」·荐书</text>

