<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
<clipPath id="clip-right">
  <rect x="0" y="0" width="600" height="800"/>
</clipPath>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>

<!-- ===== 左侧内容区 (0-390) ===== -->

<!-- 顶部 BOOK 标签 -->
<rect x="30" y="65" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="66" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>

<!-- 书名（Georgia serif，大号逐行） -->
<text x="30" y="115" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="30" dy="0">New Ideas from</tspan>
  <tspan x="30" dy="34">Dead Economists:</tspan>
  <tspan x="30" dy="34">An Introduction</tspan>
  <tspan x="30" dy="34">to Modern</tspan>
  <tspan x="30" dy="34">Economic Thought</tspan>
</text>

<!-- 作者 -->
<text x="30" y="301" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="11" fill="#555555">Todd G. Buchholz · 1989</text>

<!-- 分隔线 -->
<line x1="30" y1="325" x2="212" y2="325" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<!-- 中文描述 -->
<text x="30" y="350" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">从斯密到哈耶克，布赫霍尔茨以生动的</tspan>
  <tspan x="30" dy="19">笔触串联起经济学巨匠的思想。哈耶克</tspan>
  <tspan x="30" dy="19">的无知论揭示了开源的认识论基础——</tspan>
  <tspan x="30" dy="19">没有人能比你更了解你的需求。斯密</tspan>
  <tspan x="30" dy="19">的看不见的手解释了开源的自利性——</tspan>
  <tspan x="30" dy="19">私利导向公益，不需要中央计划。</tspan>
</text>

<!-- KEY IDEAS 区域 -->
<rect x="30" y="497" width="72" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="66" y="510" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="30" y="530" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">• 分散知识与分布式决策</tspan>
  <tspan x="30" dy="18">• 自利即公益的制度化</tspan>
  <tspan x="30" dy="18">• 市场协调 vs 制度协调</tspan>
</text>

<!-- ===== 右侧装饰区 (390-570) ===== -->

<!-- 垂直分隔线 -->
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="0.5" opacity="0.08"/>

<!-- 右侧几何装饰元素 -->
<!-- 大圆环 -->
<circle cx="490" cy="200" r="65" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<circle cx="490" cy="200" r="45" fill="none" stroke="#1B3B6B" stroke-width="0.5" opacity="0.06"/>
<circle cx="490" cy="200" r="25" fill="#1B3B6B" opacity="0.04"/>

<!-- 小方块组 -->
<rect x="430" y="320" width="8" height="8" fill="#1B3B6B" opacity="0.08" transform="rotate(45, 434, 324)"/>
<rect x="450" y="340" width="6" height="6" fill="#1B3B6B" opacity="0.06" transform="rotate(45, 453, 343)"/>
<rect x="470" y="310" width="10" height="10" fill="#1B3B6B" opacity="0.05" transform="rotate(45, 475, 315)"/>

<!-- 金句引用 -->
<text x="415" y="430" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="442" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#555555">
  <tspan x="415" dy="0">每个人都是世</tspan>
  <tspan x="415" dy="16">界上最了解自</tspan>
  <tspan x="415" dy="16">己想要什么</tspan>
  <tspan x="415" dy="16">的权威专家</tspan>
</text>
<text x="415" y="510" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="522" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="7" fill="#555555">
  <tspan x="415" dy="0">— Hayek, via Buchholz</tspan>
</text>

<!-- 底部小圆点装饰 -->
<circle cx="440" cy="650" r="3" fill="#1B3B6B" opacity="0.06"/>
<circle cx="460" cy="670" r="4" fill="#1B3B6B" opacity="0.05"/>
<circle cx="480" cy="645" r="2" fill="#1B3B6B" opacity="0.08"/>
<circle cx="510" cy="660" r="3" fill="#1B3B6B" opacity="0.04"/>
<circle cx="530" cy="640" r="2" fill="#1B3B6B" opacity="0.06"/>

<!-- ===== 底部 ===== -->

<!-- 底部标识 -->
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">「开源之道」·荐书</text>

<!-- 底部蓝色条 -->
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>

<!-- 右上角日期 -->
<text x="570" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-26</text>
</svg>