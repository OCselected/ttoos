  <tspan x="40" dy="0">How Not to</tspan>
  <tspan x="40" dy="34">Network a</tspan>
  <tspan x="40" dy="34">Nation: The</tspan>
  <tspan x="40" dy="34">Uneasy History</tspan>
  <tspan x="40" dy="34">of the Soviet</tspan>
  <tspan x="40" dy="34">Internet</tspan>
</text>
<text x="40" y="319" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Benjamin Peters (2016)</text>
<line x1="40" y1="347" x2="222" y2="347" stroke="#8B0000" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="369" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">为什么互联网诞生于美国而非苏联？</tspan>
  <tspan x="40" dy="20">Peters 以苏联OGAS网络的失败为主线，</tspan>
  <tspan x="40" dy="20">揭示了一个令人不安的真相：对等网络</tspan>
  <tspan x="40" dy="20">需要一个对等的社会结构——层级官僚</tspan>
  <tspan x="40" dy="20">体系在本质上与网络的对等逻辑不相容。</tspan>
  <tspan x="40" dy="20">问题不在于技术，而在于制度。</tspan>
</text>
<rect x="40" y="531" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
