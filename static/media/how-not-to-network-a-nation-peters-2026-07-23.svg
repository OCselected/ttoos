<text x="40" y="559" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 制度的网络效应</tspan>
  <tspan x="40" dy="18">• 网络与权力的不兼容性</tspan>
  <tspan x="40" dy="18">• OGAS 计划的失败</tspan>
  <tspan x="40" dy="18">• 制度盲区</tspan>
  <tspan x="40" dy="18">• 大分流谱系的另一面</tspan>
</text>
