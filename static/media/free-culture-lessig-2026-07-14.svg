<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-14</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Free Culture: How</tspan>
  <tspan x="40" dy="34">Big Media Uses</tspan>
  <tspan x="40" dy="34">Technology and the</tspan>
  <tspan x="40" dy="34">Law to Lock Down</tspan>
  <tspan x="40" dy="34">Culture and Control</tspan>
  <tspan x="40" dy="34">Creativity</tspan>
</text>
<text x="40" y="319" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Lawrence Lessig (2004)</text>
<line x1="40" y1="347" x2="222" y2="347" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="369" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">当网络时代的技术让每个人都能成为创造</tspan>
  <tspan x="40" dy="20">者，法律却通过版权扩张将文化锁入牢笼</tspan>
  <tspan x="40" dy="20">。Lessig</tspan>
  <tspan x="40" dy="20">以法学家特有的敏锐，揭示了数字时代最</tspan>
  <tspan x="40" dy="20">具讽刺的悖论：技术越开放，法律越封闭</tspan>
  <tspan x="40" dy="20">。</tspan>
</text>
<rect x="40" y="511" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="524" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="539" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 自由文化</tspan>
  <tspan x="40" dy="18">• 创作共用许可</tspan>
  <tspan x="40" dy="18">• 开放许可的政治哲学</tspan>
</text>
