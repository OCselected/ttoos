<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<circle cx="540" cy="140" r="155" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.05"/>
<circle cx="552" cy="148" r="102" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.07"/>
<circle cx="555" cy="150" r="50" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.09"/>
<rect x="498" y="560" width="20" height="20" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.12" transform="rotate(45, 508, 570)"/>
<rect x="536" y="595" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.14" transform="rotate(45, 543, 602)"/>
<rect x="468" y="618" width="10" height="10" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.16" transform="rotate(45, 473, 623)"/>
<circle cx="425" cy="220" r="3" fill="#1B3B6B" opacity="0.12"/>
<circle cx="460" cy="320" r="2.5" fill="#1B3B6B" opacity="0.10"/>
<circle cx="495" cy="400" r="3.5" fill="#1B3B6B" opacity="0.11"/>
<circle cx="445" cy="465" r="2.5" fill="#1B3B6B" opacity="0.13"/>
<circle cx="580" cy="265" r="3" fill="#1B3B6B" opacity="0.10"/>
<circle cx="418" cy="565" r="2" fill="#1B3B6B" opacity="0.10"/>
<circle cx="578" cy="505" r="2" fill="#1B3B6B" opacity="0.10"/>
<rect x="40" y="72" width="130" height="22" rx="3" fill="#1B3B6B"/>
<text x="105" y="87" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-14</text>
<text x="40" y="110" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">The Tacit Dimension</tspan>
</text>
<text x="40" y="150" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="16" font-weight="700" fill="#1B3B6B">
  <tspan x="40" dy="0">默会维度</tspan>
</text>
<text x="40" y="180" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="11" fill="#555555">Michael Polanyi · 1966 / UCP 2009</text>
<line x1="40" y1="205" x2="290" y2="205" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="232" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">波拉尼在 1966 年提出的命题——</tspan>
  <tspan x="40" dy="17">"我们知道的东西比我们能说出的</tspan>
  <tspan x="40" dy="17">多"——是开源社区一切实践协作</tspan>
  <tspan x="40" dy="17">的认识论地基。判断力、品味、</tspan>
  <tspan x="40" dy="17">维护者直觉，都是默会知识，</tspan>
  <tspan x="40" dy="17">无法编码、无法 SOP、无法外包。</tspan>
</text>
<rect x="40" y="460" width="95" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="87" y="473" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="498" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 知识有显性与默会两个维度</tspan>
  <tspan x="40" dy="17">• 判断力是默会的，不可编码传递</tspan>
  <tspan x="40" dy="17">• OSPO 是游走于两种秩序之间的默会实践</tspan>
</text>
<text x="538" y="430" text-anchor="middle" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" font-style="italic" fill="#1B3B6B" opacity="0.45" letter-spacing="0.5">
  <tspan x="538" dy="0">我们知道的东西，</tspan>
  <tspan x="538" dy="13">比我们能说出的</tspan>
  <tspan x="538" dy="13">更多。</tspan>
</text>
<text x="538" y="530" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="7" fill="#1B3B6B" opacity="0.35">— Polanyi, The Tacit Dimension</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之道·荐书</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
