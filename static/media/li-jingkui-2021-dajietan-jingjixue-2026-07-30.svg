<rect x="30" y="65" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="66" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>

<text x="30" y="128" font-family="Songti SC, Noto Serif CJK SC, STSong, serif" font-size="28" font-weight="900" fill="#1A1A1A">
  <tspan x="30" dy="0">大侦探经济学</tspan>
</text>
<text x="30" y="176" font-family="Songti SC, Noto Serif CJK SC, STSong, serif" font-size="18" font-weight="600" fill="#1A1A1A">
  <tspan x="30" dy="0">现代经济学中的因果推断革命</tspan>
</text>
<text x="30" y="220" font-family="Georgia, Songti SC, serif" font-size="15" fill="#555555" font-style="italic">
  <tspan x="30" dy="0">Detective Economics</tspan>
</text>

<text x="30" y="258" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">李井奎 · 中信出版社 · 2021</text>
<line x1="30" y1="280" x2="230" y2="280" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<text x="30" y="304" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">李井奎把经济学比作侦探小说——</tspan>
  <tspan x="30" dy="19">20 世纪以来的经济学，本质上是在</tspan>
  <tspan x="30" dy="19">寻找"因果"这场世纪大案。从回归</tspan>
  <tspan x="30" dy="19">到工具变量、从断点回归到双重差</tspan>
  <tspan x="30" dy="19">分，因果推断革命让经济学家成</tspan>
  <tspan x="30" dy="19">了"识别因果"的侦探，用证据而不</tspan>
  <tspan x="30" dy="19">是教条来推断世界的运行逻辑。</tspan>
</text>

<rect x="30" y="463" width="92" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="76" y="476" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="30" y="504" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">• 因果推断革命</tspan>
  <tspan x="30" dy="18">• 把经济学当侦探学</tspan>
  <tspan x="30" dy="18">• 证据高于教条</tspan>
  <tspan x="30" dy="18">• 方法论的叙事入门</tspan>
</text>

