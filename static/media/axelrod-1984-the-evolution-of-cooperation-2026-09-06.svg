<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="55%" stop-color="#1a2130"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a6542"/>
      <stop offset="50%" stop-color="#B4A078"/>
      <stop offset="100%" stop-color="#7a6542"/>
    </linearGradient>
    <linearGradient id="matrix-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a3d22" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d9b26b"/>
      <stop offset="100%" stop-color="#4a3d22" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d9b26b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d9b26b" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow-r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,6 L0,12 Z" fill="#d9b26b" opacity="0.85"/>
    </marker>
  </defs>

  <rect width="2000" height="1200" fill="url(#bg)"/>

  <!-- Decorative border -->
  <rect x="60" y="60" width="1880" height="1080" fill="none" stroke="#3a3020" stroke-width="2"/>
  <rect x="80" y="80" width="1840" height="1040" fill="none" stroke="#4a3d22" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Right side: prisoner's dilemma matrix + iteration timeline -->
  <g transform="translate(1340, 130)">
    <!-- Round 1-2-3... repeated game iterations -->
    <text x="0" y="0" font-size="20" fill="#7a6542" letter-spacing="4">REPEATED GAME · 重复博弈</text>
    <text x="0" y="26" font-size="15" fill="#5a4d32" font-style="italic" letter-spacing="1">200 rounds · 15 strategies · 2 tournaments</text>

    <!-- Payoff matrix -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" font-size="18" fill="#a89678" letter-spacing="2">PAYOFF MATRIX</text>

      <!-- axis labels -->
      <text x="0" y="40" font-size="14" fill="#7a6542" letter-spacing="1">Row ↓</text>
      <text x="180" y="40" font-size="14" fill="#7a6542" letter-spacing="1">→ Column</text>

      <!-- header: columns -->
      <text x="120" y="70" font-size="16" fill="#E8DCC8" text-anchor="middle" letter-spacing="2">C</text>
      <text x="220" y="70" font-size="16" fill="#E8DCC8" text-anchor="middle" letter-spacing="2">D</text>

      <!-- Row 1: Cooperate -->
      <text x="10" y="105" font-size="16" fill="#E8DCC8" letter-spacing="2">C</text>
      <rect x="60" y="85" width="120" height="40" fill="none" stroke="url(#matrix-gold)" stroke-width="1.2"/>
      <text x="120" y="110" font-size="18" fill="#B4A078" text-anchor="middle">3, 3</text>
      <rect x="160" y="85" width="120" height="40" fill="none" stroke="#4a3d22" stroke-width="1.2"/>
      <text x="220" y="110" font-size="18" fill="#8b2e2e" text-anchor="middle">0, 5</text>

      <!-- Row 2: Defect -->
      <text x="10" y="160" font-size="16" fill="#E8DCC8" letter-spacing="2">D</text>
      <rect x="60" y="140" width="120" height="40" fill="none" stroke="#4a3d22" stroke-width="1.2"/>
      <text x="120" y="165" font-size="18" fill="#8b2e2e" text-anchor="middle">5, 0</text>
      <rect x="160" y="140" width="120" height="40" fill="none" stroke="#4a3d22" stroke-width="1.2"/>
      <text x="220" y="165" font-size="18" fill="#E8DCC8" text-anchor="middle">1, 1</text>

      <!-- Nash equilibrium annotation -->
      <text x="120" y="210" font-size="13" fill="#7a6542" text-anchor="middle" font-style="italic" letter-spacing="1">Nash = (D, D) — 但重复博弈下</text>
      <text x="120" y="228" font-size="13" fill="#7a6542" text-anchor="middle" font-style="italic" letter-spacing="1">合作可以稳定涌现</text>
    </g>

    <!-- TFT strategy timeline (rounds 1-8) -->
    <g transform="translate(0, 340)">
      <text x="0" y="0" font-size="18" fill="#a89678" letter-spacing="2">TIT FOR TAT · 一报还一报</text>
      <text x="0" y="24" font-size="14" fill="#5a4d32" font-style="italic" letter-spacing="1">"copy your opponent's previous move"</text>

      <!-- Row: TFT actions -->
      <text x="0" y="70" font-size="13" fill="#7a6542" letter-spacing="1">TFT</text>
      <g transform="translate(0, 50)">
        <rect x="0"   y="0" width="26" height="26" fill="none" stroke="#B4A078" stroke-width="1.2"/>
        <text x="13" y="19" font-size="16" fill="#B4A078" text-anchor="middle">C</text>
        <rect x="32"  y="0" width="26" height="26" fill="none" stroke="#B4A078" stroke-width="1.2"/>
        <text x="45" y="19" font-size="16" fill="#B4A078" text-anchor="middle">C</text>
        <rect x="64"  y="0" width="26" height="26" fill="none" stroke="#8b2e2e" stroke-width="1.2"/>
        <text x="77" y="19" font-size="16" fill="#8b2e2e" text-anchor="middle">D</text>
        <rect x="96"  y="0" width="26" height="26" fill="none" stroke="#8b2e2e" stroke-width="1.2"/>
        <text x="109" y="19" font-size="16" fill="#8b2e2e" text-anchor="middle">D</text>
        <rect x="128" y="0" width="26" height="26" fill="none" stroke="#B4A078" stroke-width="1.2"/>
        <text x="141" y="19" font-size="16" fill="#B4A078" text-anchor="middle">C</text>
        <rect x="160" y="0" width="26" height="26" fill="none" stroke="#B4A078" stroke-width="1.2"/>
        <text x="173" y="19" font-size="16" fill="#B4A078" text-anchor="middle">C</text>
        <rect x="192" y="0" width="26" height="26" fill="none" stroke="#B4A078" stroke-width="1.2"/>
        <text x="205" y="19" font-size="16" fill="#B4A078" text-anchor="middle">C</text>
        <rect x="224" y="0" width="26" height="26" fill="none" stroke="#B4A078" stroke-width="1.2"/>
        <text x="237" y="19" font-size="16" fill="#B4A078" text-anchor="middle">C</text>
      </g>

      <!-- Row: opponent actions -->
      <text x="0" y="118" font-size="13" fill="#7a6542" letter-spacing="1">OPP</text>
      <g transform="translate(0, 98)">
        <rect x="0"   y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="13" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
        <rect x="32"  y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="45" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
        <rect x="64"  y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="77" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">D</text>
        <rect x="96"  y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="109" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
        <rect x="128" y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="141" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
        <rect x="160" y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="173" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
        <rect x="192" y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="205" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
        <rect x="224" y="0" width="26" height="26" fill="none" stroke="#5a4d32" stroke-width="1"/>
        <text x="237" y="19" font-size="16" fill="#8a7a5a" text-anchor="middle">C</text>
      </g>

      <!-- Round marker -->
      <g transform="translate(0, 150)">
        <text x="0" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R1</text>
        <text x="32" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R2</text>
        <text x="64" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R3</text>
        <text x="96" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R4</text>
        <text x="128" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R5</text>
        <text x="160" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R6</text>
        <text x="192" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R7</text>
        <text x="224" y="10" font-size="11" fill="#5a4d32" letter-spacing="1">R8</text>
      </g>

      <!-- Annotation: retaliation → forgiveness -->
      <g transform="translate(0, 200)">
        <line x1="77" y1="0" x2="77" y2="20" stroke="#8b2e2e" stroke-width="1.2" stroke-dasharray="2 3"/>
        <text x="77" y="40" font-size="13" fill="#8b2e2e" text-anchor="middle" letter-spacing="1">RETIATION</text>
        <text x="77" y="60" font-size="12" fill="#8b2e2e" text-anchor="middle" font-style="italic">可激怒</text>

        <line x1="141" y1="-108" x2="141" y2="-90" stroke="#B4A078" stroke-width="1.2" stroke-dasharray="2 3"/>
        <text x="141" y="40" font-size="13" fill="#B4A078" text-anchor="middle" letter-spacing="1">FORGIVENESS</text>
        <text x="141" y="60" font-size="12" fill="#B4A078" text-anchor="middle" font-style="italic">宽容</text>
      </g>
    </g>

    <!-- Four properties box -->
    <g transform="translate(0, 640)">
      <text x="0" y="0" font-size="18" fill="#a89678" letter-spacing="2">FOUR PROPERTIES · 四属性</text>

      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="120" height="42" fill="none" stroke="url(#bronze)" stroke-width="1.2"/>
        <text x="12" y="20" font-size="15" fill="#E8DCC8" letter-spacing="2">善良</text>
        <text x="12" y="35" font-size="11" fill="#7a6542" letter-spacing="1">NICE</text>

        <rect x="140" y="0" width="120" height="42" fill="none" stroke="url(#bronze)" stroke-width="1.2"/>
        <text x="152" y="20" font-size="15" fill="#E8DCC8" letter-spacing="2">可激怒</text>
        <text x="152" y="35" font-size="11" fill="#7a6542" letter-spacing="1">RETALIATORY</text>

        <rect x="0" y="58" width="120" height="42" fill="none" stroke="url(#bronze)" stroke-width="1.2"/>
        <text x="12" y="78" font-size="15" fill="#E8DCC8" letter-spacing="2">宽容</text>
        <text x="12" y="93" font-size="11" fill="#7a6542" letter-spacing="1">FORGIVING</text>

        <rect x="140" y="58" width="120" height="42" fill="none" stroke="url(#bronze)" stroke-width="1.2"/>
        <text x="152" y="78" font-size="15" fill="#E8DCC8" letter-spacing="2">清晰</text>
        <text x="152" y="93" font-size="11" fill="#7a6542" letter-spacing="1">CLEAR</text>
      </g>
    </g>

    <!-- Bottom meta -->
    <text x="0" y="900" font-size="16" fill="#4a3d22" letter-spacing="2">GAME THEORY · COOPERATION</text>
    <text x="0" y="928" font-size="13" fill="#3a3020" letter-spacing="2">— cooperation emerges through play —</text>
  </g>

  <!-- Glow behind title -->
  <ellipse cx="750" cy="500" rx="700" ry="280" fill="url(#glow)"/>

  <!-- Category label -->
  <g transform="translate(140, 170)">
    <rect x="0" y="0" width="180" height="42" fill="none" stroke="url(#bronze)" stroke-width="1.5"/>
    <text x="90" y="28" font-size="22" fill="url(#bronze)" text-anchor="middle" letter-spacing="6">荐书</text>
  </g>

  <!-- Main title (English) -->
  <text x="140" y="290" font-size="58" fill="#E8DCC8" letter-spacing="3" font-weight="normal">The Evolution of</text>
  <text x="140" y="360" font-size="58" fill="#E8DCC8" letter-spacing="3" font-weight="normal">Cooperation</text>

  <!-- Chinese subtitle -->
  <text x="140" y="430" font-size="48" fill="url(#bronze)" letter-spacing="10">合 作 的 进 化</text>

  <!-- Decorative divider -->
  <line x1="140" y1="490" x2="1220" y2="490" stroke="#4a3d22" stroke-width="1"/>
  <circle cx="140" cy="490" r="4" fill="#B4A078"/>
  <circle cx="1220" cy="490" r="4" fill="#B4A078"/>

  <!-- Author -->
  <text x="140" y="555" font-size="34" fill="#D9C4A0" letter-spacing="3">Robert Axelrod  ·  罗伯特·艾克斯罗德</text>
  <text x="140" y="595" font-size="22" fill="#7a6542" letter-spacing="2">Basic Books · 1984   ·   上海人民出版社 · 中译本</text>

  <!-- Core concept: 一报还一报 -->
  <g transform="translate(140, 660)">
    <text x="0" y="0" font-size="20" fill="#7a6542" letter-spacing="4">核 心 策 略  ·  CORE STRATEGY</text>
    <text x="0" y="55" font-size="42" fill="#E8DCC8" letter-spacing="8">一报还一报</text>
    <text x="0" y="92" font-size="22" fill="#a89678" font-style="italic" letter-spacing="2">Tit for Tat — copy your opponent's previous move</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(140, 830)">
    <text x="0" y="0" font-size="22" fill="#8a7a5a" letter-spacing="2">"在最简策略胜出的那一刻，开源社区</text>
    <text x="0" y="30" font-size="22" fill="#8a7a5a" letter-spacing="2">治理的四个制度属性——善良性、可激怒性、</text>
    <text x="0" y="60" font-size="22" fill="#8a7a5a" letter-spacing="2">宽容性、清晰性——被一次性锁定。"</text>
    <text x="0" y="94" font-size="17" fill="#5a4d32" letter-spacing="1">— 窄廊，2026-09-06</text>
  </g>

  <!-- Bottom section -->
  <line x1="140" y1="1000" x2="1220" y2="1000" stroke="#3a3020" stroke-width="1"/>

  <text x="140" y="1050" font-size="20" fill="#7a6542" letter-spacing="3">开源之书 · 每日荐书</text>
  <text x="140" y="1082" font-size="20" fill="#5a4d32" letter-spacing="1">2026-09-06 · 「开源之道」·窄廊</text>

  <!-- Bottom right meta -->
  <text x="1820" y="1080" font-size="14" fill="#3a3020" text-anchor="end" letter-spacing="2">GAME THEORY · TFT · 大分流2.0</text>
</svg>
