<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="100%" stop-color="#123049"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE2"/>
      <stop offset="100%" stop-color="#E8DFCB"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- 印刷网格底纹 -->
  <g stroke="#1D4568" stroke-width="0.6" opacity="0.55">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="680" x2="600" y2="680"/>
    <line x1="60" y1="0" x2="60" y2="800"/>
    <line x1="540" y1="0" x2="540" y2="800"/>
  </g>

  <!-- 顶部标签 -->
  <text x="60" y="86" font-family="Georgia, 'Songti SC', serif" font-size="15" fill="#B4A078" letter-spacing="4">OPEN SOURCE WAY · PAPER READING</text>
  <text x="60" y="108" font-family="Georgia, serif" font-size="13" fill="#8FA9BF" letter-spacing="2">2026 · 每日开源推荐 · 第 207 号</text>
  <line x1="60" y1="120" x2="540" y2="120" stroke="#B4A078" stroke-width="1"/>

  <!-- 主视觉：上游刻度 → 逐层转录 → 到下面已经算不出 -->
  <g transform="translate(0,158)">
    <!-- 上游：机构刻度尺（口径定义者） -->
    <line x1="90" y1="46" x2="510" y2="46" stroke="#8FA9BF" stroke-width="1.2"/>
    <g stroke="#8FA9BF" stroke-width="1">
      <line x1="90" y1="46" x2="90" y2="30"/>
      <line x1="134" y1="46" x2="134" y2="34"/>
      <line x1="178" y1="46" x2="178" y2="30"/>
      <line x1="222" y1="46" x2="222" y2="34"/>
      <line x1="266" y1="46" x2="266" y2="30"/>
      <line x1="310" y1="46" x2="310" y2="34"/>
      <line x1="354" y1="46" x2="354" y2="30"/>
      <line x1="398" y1="46" x2="398" y2="34"/>
      <line x1="442" y1="46" x2="442" y2="30"/>
      <line x1="486" y1="46" x2="486" y2="34"/>
      <line x1="510" y1="46" x2="510" y2="30"/>
    </g>
    <text x="90" y="22" font-family="Georgia, serif" font-size="11" fill="#6E8AA0" letter-spacing="2">UPSTREAM · 口径</text>

    <!-- 第一层转录：完整，刻度清晰 -->
    <line x1="110" y1="96" x2="490" y2="96" stroke="#7E97AC" stroke-width="1"/>
    <g stroke="#7E97AC" stroke-width="0.9">
      <line x1="110" y1="96" x2="110" y2="84"/>
      <line x1="158" y1="96" x2="158" y2="87"/>
      <line x1="206" y1="96" x2="206" y2="84"/>
      <line x1="254" y1="96" x2="254" y2="87"/>
      <line x1="302" y1="96" x2="302" y2="84"/>
      <line x1="350" y1="96" x2="350" y2="87"/>
      <line x1="398" y1="96" x2="398" y2="84"/>
      <line x1="446" y1="96" x2="446" y2="87"/>
      <line x1="490" y1="96" x2="490" y2="84"/>
    </g>

    <!-- 第二层：开始稀疏，有断口 -->
    <line x1="140" y1="146" x2="220" y2="146" stroke="#5A7C97" stroke-width="1"/>
    <line x1="248" y1="146" x2="300" y2="146" stroke="#5A7C97" stroke-width="1"/>
    <line x1="340" y1="146" x2="378" y2="146" stroke="#5A7C97" stroke-width="1"/>
    <line x1="404" y1="146" x2="460" y2="146" stroke="#5A7C97" stroke-width="1"/>
    <g stroke="#5A7C97" stroke-width="0.9">
      <line x1="140" y1="146" x2="140" y2="134"/>
      <line x1="180" y1="146" x2="180" y2="137"/>
      <line x1="220" y1="146" x2="220" y2="134"/>
      <line x1="248" y1="146" x2="248" y2="137"/>
      <line x1="300" y1="146" x2="300" y2="134"/>
      <line x1="340" y1="146" x2="340" y2="137"/>
      <line x1="378" y1="146" x2="378" y2="134"/>
      <line x1="404" y1="146" x2="404" y2="137"/>
      <line x1="460" y1="146" x2="460" y2="134"/>
    </g>

    <!-- 第三层：只剩碎片 -->
    <g stroke="#3E6B8E" stroke-width="1">
      <line x1="170" y1="196" x2="250" y2="196"/>
      <line x1="172" y1="196" x2="172" y2="184"/>
      <line x1="250" y1="196" x2="250" y2="184"/>
      <line x1="316" y1="196" x2="356" y2="196"/>
      <line x1="316" y1="196" x2="316" y2="184"/>
      <line x1="356" y1="196" x2="356" y2="184"/>
      <line x1="416" y1="196" x2="478" y2="196"/>
      <line x1="416" y1="196" x2="416" y2="184"/>
      <line x1="478" y1="196" x2="478" y2="184"/>
    </g>

    <!-- 下游：一张羊皮纸，刻度已不可复算 -->
    <g transform="translate(250,236)">
      <rect x="0" y="0" width="180" height="112" rx="2" fill="url(#paper)" opacity="0.96"/>
      <rect x="8" y="8" width="164" height="96" fill="none" stroke="#B4A078" stroke-width="0.6" opacity="0.7"/>
      <!-- 模糊不清的刻度 -->
      <g stroke="#8A7A55" stroke-width="0.8" opacity="0.5">
        <line x1="24" y1="34" x2="60" y2="34"/>
        <line x1="70" y1="34" x2="90" y2="34"/>
        <line x1="100" y1="34" x2="146" y2="34"/>
        <line x1="24" y1="52" x2="46" y2="52"/>
        <line x1="56" y1="52" x2="104" y2="52"/>
        <line x1="118" y1="52" x2="128" y2="52"/>
        <line x1="24" y1="70" x2="80" y2="70"/>
        <line x1="92" y1="70" x2="140" y2="70"/>
      </g>
      <!-- 问号区（不可复算） -->
      <text x="24" y="98" font-family="Georgia, serif" font-size="13" fill="#8A7A55">?</text>
      <text x="44" y="98" font-family="Georgia, serif" font-size="13" fill="#8A7A55">?</text>
      <text x="64" y="98" font-family="Georgia, serif" font-size="13" fill="#8A7A55">?</text>
    </g>

    <!-- 转录箭头 -->
    <g stroke="#B4A078" stroke-width="0.9" opacity="0.85">
      <line x1="300" y1="60" x2="300" y2="82"/>
      <line x1="300" y1="112" x2="300" y2="132"/>
      <line x1="300" y1="162" x2="300" y2="182"/>
      <line x1="340" y1="204" x2="340" y2="230"/>
    </g>

    <!-- 标注 -->
    <text x="530" y="50" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#7E97AC" letter-spacing="1">定义口径</text>
    <text x="530" y="150" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#7E97AC" letter-spacing="1">生产数据</text>
    <text x="530" y="200" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#7E97AC" letter-spacing="1">做出推断</text>
    <text x="530" y="300" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#B4A078" letter-spacing="1">已无法复算</text>
    <line x1="440" y1="296" x2="500" y2="296" stroke="#B4A078" stroke-width="0.8" stroke-dasharray="3 4"/>
  </g>

  <!-- 主标题 -->
  <text x="300" y="612" text-anchor="middle" font-family="'Songti SC', 'Noto Serif CJK SC', Georgia, serif" font-size="44" fill="#F5EFE2" letter-spacing="3">度量权的上游</text>
  <text x="300" y="666" text-anchor="middle" font-family="'Songti SC', 'Noto Serif CJK SC', Georgia, serif" font-size="28" fill="#E8DFCB" letter-spacing="1">与不可复算的数字</text>
  <line x1="220" y1="692" x2="380" y2="692" stroke="#B4A078" stroke-width="1.2"/>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8FA9BF" letter-spacing="2">SSRN 7629481 · NVD · GitHub · Elekto</text>

  <!-- 署名与出处 -->
  <text x="60" y="762" font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#B4A078">开源之道 · 适兕 × 窄廊</text>
  <text x="540" y="762" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#6E8AA0">SSRN 10.2139/ssrn.7629481</text>
</svg>
