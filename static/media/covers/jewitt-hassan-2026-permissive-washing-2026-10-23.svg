<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0E1B2C"/><stop offset="60%" stop-color="#132A42"/><stop offset="100%" stop-color="#0A1522"/>
  </linearGradient>
  <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D9C08A"/><stop offset="50%" stop-color="#B4A078"/><stop offset="100%" stop-color="#8A7452"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F4EBD6"/><stop offset="100%" stop-color="#DCCDB0"/>
  </linearGradient>
</defs>
<rect width="600" height="800" fill="url(#bg)"/>
<rect x="18" y="18" width="564" height="764" fill="none" stroke="#B4A078" stroke-opacity="0.35" stroke-width="1"/>
<g stroke="#B4A078" stroke-opacity="0.55" stroke-width="1.2" fill="none">
  <path d="M18 64 L18 18 L64 18"/><path d="M536 18 L582 18 L582 64"/>
  <path d="M18 736 L18 782 L64 782"/><path d="M536 782 L582 782 L582 736"/>
</g>
<g fill="#B4A078" fill-opacity="0.85">
  <circle cx="300" cy="30" r="2.5"/><circle cx="570" cy="400" r="2.5"/><circle cx="300" cy="770" r="2.5"/><circle cx="30" cy="400" r="2.5"/>
</g>

<!-- 三条层：dataset -> model -> application，自下而上 -->
<g stroke="#B4A078" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 6">
  <line x1="90" y1="470" x2="510" y2="470"/>
  <line x1="90" y1="404" x2="510" y2="404"/>
  <line x1="90" y1="338" x2="510" y2="338"/>
</g>

<!-- 层一：dataset 卡片，只有标签没有正文（空心） -->
<g>
  <rect x="112" y="436" width="76" height="68" rx="3" fill="none" stroke="#F4EBD6" stroke-opacity="0.5" stroke-width="1.4"/>
  <g stroke="#F4EBD6" stroke-opacity="0.25" stroke-width="1">
    <line x1="124" y1="456" x2="176" y2="456"/><line x1="124" y1="468" x2="176" y2="468"/><line x1="124" y1="480" x2="164" y2="480"/>
  </g>
  <circle cx="188" cy="436" r="9" fill="#0A1522" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M184 432 L192 440 M192 432 L184 440" stroke="#C0504D" stroke-width="1.4"/>
</g>

<!-- 层二：model 卡片，同样空心 -->
<g>
  <rect x="262" y="370" width="76" height="68" rx="3" fill="none" stroke="#F4EBD6" stroke-opacity="0.5" stroke-width="1.4"/>
  <g stroke="#F4EBD6" stroke-opacity="0.25" stroke-width="1">
    <line x1="274" y1="390" x2="326" y2="390"/><line x1="274" y1="402" x2="326" y2="402"/><line x1="274" y1="414" x2="314" y2="414"/>
  </g>
  <circle cx="338" cy="370" r="9" fill="#0A1522" stroke="#C0504D" stroke-width="1.4"/>
  <path d="M334 366 L342 374 M342 366 L334 374" stroke="#C0504D" stroke-width="1.4"/>
</g>

<!-- 层三：application 卡片，实心羊皮纸 = 有正文 -->
<g>
  <rect x="412" y="304" width="76" height="68" rx="3" fill="url(#paper)" fill-opacity="0.92" stroke="#F4EBD6" stroke-opacity="0.7" stroke-width="1.4"/>
  <g stroke="#0E1B2C" stroke-opacity="0.55" stroke-width="1.4">
    <line x1="424" y1="324" x2="476" y2="324"/><line x1="424" y1="336" x2="476" y2="336"/><line x1="424" y1="348" x2="464" y2="348"/>
  </g>
</g>

<!-- 递进箭头 -->
<g stroke="url(#bronze)" stroke-width="1.4" fill="none">
  <path d="M196 462 L252 412"/><path d="M346 396 L402 342"/>
</g>
<g fill="#B4A078"><path d="M252 412 l-9 3 l5 6 z"/><path d="M402 342 l-9 3 l5 6 z"/></g>

<!-- 底部砝码：一份未随工件同行的契约 -->
<g>
  <circle cx="300" cy="612" r="30" fill="none" stroke="#B4A078" stroke-opacity="0.55" stroke-width="1.2"/>
  <line x1="300" y1="470" x2="300" y2="580" stroke="#B4A078" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="236" y="640" width="128" height="46" rx="4" fill="url(#paper)" fill-opacity="0.95"/>
  <g stroke="#0E1B2C" stroke-opacity="0.6" stroke-width="1.3">
    <line x1="250" y1="656" x2="350" y2="656"/><line x1="250" y1="668" x2="330" y2="668"/>
  </g>
  <g fill="#0E1B2C" fill-opacity="0.75">
    <circle cx="352" cy="670" r="6"/><path d="M352 676 l0 10 l-6 6 M352 686 l6 6"/>
  </g>
</g>

<text x="300" y="112" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="25" fill="url(#bronze)" letter-spacing="6">开源之书 · 论文略读</text>
<line x1="228" y1="134" x2="372" y2="134" stroke="#B4A078" stroke-opacity="0.5"/>
<text x="300" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#F4EBD6" fill-opacity="0.95">Permissive-Washing</text>
<text x="300" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F4EBD6" fill-opacity="0.72">in the Open AI Supply Chain</text>
<text x="300" y="252" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="20" fill="#F4EBD6" fill-opacity="0.88">许可标签，还是许可载荷？</text>
<line x1="200" y1="278" x2="400" y2="278" stroke="#B4A078" stroke-opacity="0.35"/>

<text x="300" y="722" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="15" fill="#B4A078" fill-opacity="0.9">Jewitt · Rajbahadur · Li · Adams · Hassan</text>
<text x="300" y="746" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#F4EBD6" fill-opacity="0.5" letter-spacing="1">KDD 2026 · QQ 124,278 SUPPLY CHAINS</text>
<text x="30" y="770" font-family="'Songti SC', Georgia, serif" font-size="13" fill="#B4A078" fill-opacity="0.85">开源之道 · 适兕 × 窄廊</text>
<text x="570" y="770" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#F4EBD6" fill-opacity="0.45">arXiv 2602.08816</text>
</svg>