<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0E1B2C"/><stop offset="60%" stop-color="#132A42"/><stop offset="100%" stop-color="#0A1522"/>
  </linearGradient>
  <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D9C08A"/><stop offset="50%" stop-color="#B4A078"/><stop offset="100%" stop-color="#8A7452"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F4EBD6"/><stop offset="100%" stop-color="#DCCDB0"/>
  </linearGradient>
</defs>
<rect width="600" height="800" fill="url(#bg)"/>
<rect x="18" y="18" width="564" height="764" fill="none" stroke="#B4A078" stroke-opacity="0.35" stroke-width="1"/>
<g stroke="#B4A078" stroke-opacity="0.55" stroke-width="1.2" fill="none">
  <path d="M18 64 L18 18 L64 18"/><path d="M536 18 L582 18 L582 64"/>
  <path d="M18 736 L18 782 L64 782"/><path d="M536 782 L582 782 L582 736"/>
</g>
<g fill="#B4A078" fill-opacity="0.85">
  <circle cx="300" cy="30" r="2.5"/><circle cx="570" cy="400" r="2.5"/><circle cx="300" cy="770" r="2.5"/><circle cx="30" cy="400" r="2.5"/>
</g>

<!-- 一块门板：三格填满，最上一格空着 -->
<g>
  <rect x="196" y="318" width="208" height="272" rx="4" fill="url(#paper)" fill-opacity="0.10" stroke="#B4A078" stroke-opacity="0.75" stroke-width="1.6"/>
  <!-- 分格线 -->
  <g stroke="#B4A078" stroke-opacity="0.45" stroke-width="1">
    <line x1="196" y1="386" x2="404" y2="386"/>
    <line x1="196" y1="454" x2="404" y2="454"/>
    <line x1="196" y1="522" x2="404" y2="522"/>
  </g>
  <!-- 最上一格：空 -->
  <text x="300" y="360" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="15" fill="#B4A078" fill-opacity="0.55" letter-spacing="3">效果</text>
  <circle cx="300" cy="360" r="26" fill="none" stroke="#B4A078" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 5"/>
  <!-- 第二格：资源，填实 -->
  <text x="300" y="428" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="15" fill="#F4EBD6" fill-opacity="0.8" letter-spacing="3">资源</text>
  <line x1="252" y1="438" x2="348" y2="438" stroke="#F4EBD6" stroke-opacity="0.28" stroke-width="1"/>
  <!-- 第三格：过程，半填 -->
  <text x="300" y="496" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="15" fill="#F4EBD6" fill-opacity="0.8" letter-spacing="3">过程</text>
  <line x1="252" y1="506" x2="318" y2="506" stroke="#F4EBD6" stroke-opacity="0.28" stroke-width="1"/>
  <!-- 第四格：技术要件，填实 -->
  <text x="300" y="564" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="15" fill="#F4EBD6" fill-opacity="0.8" letter-spacing="3">要件</text>
  <line x1="252" y1="574" x2="348" y2="574" stroke="#F4EBD6" stroke-opacity="0.28" stroke-width="1"/>
</g>

<!-- 锁舌：从三格伸向空档，最后一段断开 -->
<g stroke="url(#bronze)" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="404" y1="560" x2="452" y2="560"/>
  <line x1="404" y1="490" x2="452" y2="490"/>
  <line x1="404" y1="420" x2="452" y2="420"/>
</g>
<g stroke="url(#bronze)" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0.5">
  <line x1="452" y1="352" x2="516" y2="352"/>
</g>
<!-- 钥匙孔：位于断开处 -->
<g>
  <circle cx="486" cy="342" r="13" fill="none" stroke="#B4A078" stroke-opacity="0.85" stroke-width="1.6"/>
  <path d="M486 355 L486 376 L480 384 L492 384 Z" fill="#B4A078" fill-opacity="0.22" stroke="#B4A078" stroke-opacity="0.85" stroke-width="1.2"/>
</g>

<!-- 下方：一枚天平，左右不等 -->
<g stroke="#B4A078" stroke-opacity="0.5" stroke-width="1.3" fill="none">
  <line x1="300" y1="618" x2="300" y2="652"/>
  <line x1="222" y1="620" x2="378" y2="634" stroke-opacity="0.7"/>
  <line x1="222" y1="620" x2="222" y2="638"/><line x1="378" y1="634" x2="378" y2="658"/>
  <circle cx="300" cy="614" r="5" fill="#B4A078" fill-opacity="0.6" stroke="none"/>
</g>
<g>
  <rect x="196" y="638" width="52" height="26" rx="2" fill="url(#paper)" fill-opacity="0.55"/>
  <text x="222" y="656" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="11" fill="#0E1B2C" fill-opacity="0.75">拿到</text>
  <rect x="352" y="658" width="52" height="34" rx="2" fill="url(#paper)" fill-opacity="0.92"/>
  <text x="378" y="680" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="11" fill="#0E1B2C" fill-opacity="0.85">参与</text>
</g>
<line x1="300" y1="652" x2="300" y2="682" stroke="#B4A078" stroke-opacity="0.35" stroke-width="1"/>
<line x1="266" y1="686" x2="334" y2="686" stroke="#B4A078" stroke-opacity="0.45" stroke-width="1.4"/>

<!-- 标题文字 -->
<text x="300" y="112" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="25" fill="url(#bronze)" letter-spacing="6">开源之书 · 论文略读</text>
<line x1="228" y1="134" x2="372" y2="134" stroke="#B4A078" stroke-opacity="0.5"/>
<text x="300" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#F4EBD6" fill-opacity="0.95">Beyond "Open Washing"</text>
<text x="300" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F4EBD6" fill-opacity="0.72">Redefining Openness for Open Source LLMs</text>
<text x="300" y="252" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="20" fill="#F4EBD6" fill-opacity="0.88">三格填满，最上一格空着</text>
<line x1="200" y1="278" x2="400" y2="278" stroke="#B4A078" stroke-opacity="0.35"/>

<text x="300" y="722" text-anchor="middle" font-family="'Songti SC', Georgia, serif" font-size="15" fill="#B4A078" fill-opacity="0.9">Juntura · Eloranta</text>
<text x="300" y="746" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#F4EBD6" fill-opacity="0.5" letter-spacing="1">AOM PROCEEDINGS 2025 · 16 EXPERT INTERVIEWS</text>
<text x="30" y="770" font-family="'Songti SC', Georgia, serif" font-size="13" fill="#B4A078" fill-opacity="0.85">开源之道 · 适兕 × 窄廊</text>
<text x="570" y="770" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#F4EBD6" fill-opacity="0.45">10.5465/amproc.2025.17774</text>
</svg>
