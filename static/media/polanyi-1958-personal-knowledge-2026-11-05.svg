<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<rect x="0" y="795" width="600" height="4" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<circle cx="535" cy="600" r="135" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.06"/>
<circle cx="535" cy="600" r="90" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.08"/>
<circle cx="535" cy="600" r="46" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.10"/>
<rect x="450" y="225" width="6" height="6" fill="#1B3B6B" opacity="0.10" transform="rotate(45, 453, 228)"/>
<rect x="473" y="250" width="5" height="5" fill="#1B3B6B" opacity="0.08" transform="rotate(45, 475, 252)"/>
<rect x="438" y="270" width="7" height="7" fill="#1B3B6B" opacity="0.10" transform="rotate(45, 441, 273)"/>
<circle cx="460" cy="318" r="2.5" fill="#1B3B6B" opacity="0.12"/>
<circle cx="480" cy="336" r="2" fill="#1B3B6B" opacity="0.10"/>
<circle cx="445" cy="358" r="2.5" fill="#1B3B6B" opacity="0.10"/>
<circle cx="470" cy="392" r="2" fill="#1B3B6B" opacity="0.09"/>
<rect x="40" y="70" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="76" y="85" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-11-05</text>
<text x="40" y="110" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="28" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Personal</tspan>
  <tspan x="40" dy="36">Knowledge</tspan>
</text>
<text x="40" y="190" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="15" fill="#1B3B6B" opacity="0.75">
  <tspan x="40" dy="0">Towards a Post-Critical Philosophy</tspan>
</text>
<text x="40" y="228" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Michael Polanyi (1891–1976) · 1958</text>
<line x1="40" y1="256" x2="222" y2="256" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="282" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">一个物理化学家转向哲学，用四百页说</tspan>
  <tspan x="40" dy="20">明一件今天听起来仍然刺耳的事：</tspan>
  <tspan x="40" dy="20">科学不是条文，是一种被担保的技艺。</tspan>
  <tspan x="40" dy="20">没有任何条文能替你把「什么算数」</tspan>
  <tspan x="40" dy="20">判断出来——判断由人做出，并且只能</tspan>
  <tspan x="40" dy="20">由人承担。</tspan>
</text>
<rect x="40" y="422" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="435" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="461" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 集中意识 / 辅助意识：工具从不被看</tspan>
  <tspan x="40" dy="18">• 相邻互评的链条，怎么把标准传下去</tspan>
  <tspan x="40" dy="18">• 担保式的言说：说过的话要由人担</tspan>
</text>
<text x="463" y="530" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" fill="#1B3B6B" opacity="0.40">
  <tspan x="463" dy="0">我</tspan>
  <tspan x="463" dy="12">知</tspan>
  <tspan x="463" dy="12">道</tspan>
  <tspan x="463" dy="12">的</tspan>
  <tspan x="463" dy="12">多</tspan>
  <tspan x="463" dy="12">于</tspan>
  <tspan x="463" dy="12">我</tspan>
  <tspan x="463" dy="12">能</tspan>
  <tspan x="463" dy="12">说</tspan>
  <tspan x="463" dy="12">的</tspan>
</text>
<text x="463" y="700" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="8" fill="#1B3B6B" opacity="0.30">— Michael Polanyi</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OPEN SOURCE · 荐书</text>
<text x="40" y="757" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#B4A078">开源之道 · 适兕 × 窄廊</text>
</svg>
