  <tspan x="415" dy="16">一</tspan>
  <tspan x="415" dy="16">处</tspan>
</text>
<text x="415" y="690" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="702" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="7" fill="#555555">
  <tspan x="415" dy="0">— S. Rosenberg 2007</tspan>
</text>

