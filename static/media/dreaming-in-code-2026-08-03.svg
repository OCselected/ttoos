</text>
<text x="415" y="442" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#555555">
  <tspan x="415" dy="0">成</tspan>
  <tspan x="415" dy="16">功</tspan>
  <tspan x="415" dy="16">各</tspan>
  <tspan x="415" dy="16">有</tspan>
  <tspan x="415" dy="16">各</tspan>
  <tspan x="415" dy="16">的</tspan>
  <tspan x="415" dy="16">成</tspan>
  <tspan x="415" dy="16">功</tspan>
  <tspan x="415" dy="16">，</tspan>
  <tspan x="415" dy="16">失</tspan>
  <tspan x="415" dy="16">败</tspan>
  <tspan x="415" dy="16">却</tspan>
  <tspan x="415" dy="16">都</tspan>
