<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<line x1="390" y1="60" x2="390" y2="740" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>

<!-- right geometric decoration: branching network motif -->
<circle cx="535" cy="120" r="170" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.05"/>
<circle cx="545" cy="130" r="115" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.07"/>
<circle cx="555" cy="138" r="65" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.09"/>

<!-- branching nodes (networked science visual) -->
<g stroke="#1B3B6B" stroke-width="1" fill="#1B3B6B" opacity="0.14">
  <circle cx="440" cy="270" r="4" fill="#1B3B6B"/>
  <circle cx="500" cy="310" r="3.5" fill="#1B3B6B"/>
  <circle cx="555" cy="270" r="3" fill="#1B3B6B"/>
  <circle cx="475" cy="380" r="3" fill="#1B3B6B"/>
  <circle cx="530" cy="405" r="4" fill="#1B3B6B"/>
  <circle cx="450" cy="440" r="3" fill="#1B3B6B"/>
  <circle cx="515" cy="470" r="3.5" fill="#1B3B6B"/>
  <line x1="440" y1="270" x2="500" y2="310" stroke-width="0.8"/>
  <line x1="500" y1="310" x2="555" y2="270" stroke-width="0.8"/>
  <line x1="440" y1="270" x2="475" y2="380" stroke-width="0.8"/>
  <line x1="475" y1="380" x2="530" y2="405" stroke-width="0.8"/>
  <line x1="530" y1="405" x2="515" y2="470" stroke-width="0.8"/>
  <line x1="475" y1="380" x2="450" y2="440" stroke-width="0.8"/>
</g>

<circle cx="465" cy="590" r="22" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.06"/>
<circle cx="485" cy="605" r="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.08"/>
<rect x="445" y="640" width="18" height="18" fill="none" stroke="#1B3B6B" stroke-width="1.2" opacity="0.12" transform="rotate(45, 454, 649)"/>
<rect x="500" y="645" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.14" transform="rotate(45, 507, 652)"/>
<rect x="410" y="670" width="10" height="10" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.16" transform="rotate(45, 415, 675)"/>

<circle cx="425" cy="230" r="3" fill="#1B3B6B" opacity="0.12"/>
<circle cx="575" cy="240" r="3" fill="#1B3B6B" opacity="0.10"/>
<circle cx="430" cy="700" r="2.5" fill="#1B3B6B" opacity="0.13"/>

<rect x="40" y="72" width="130" height="22" rx="3" fill="#1B3B6B"/>
<text x="105" y="87" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-11</text>

<text x="40" y="107" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="24" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Reinventing</tspan>
  <tspan x="40" dy="30">Discovery</tspan>
</text>

<text x="40" y="205" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="11" fill="#555555">Michael Nielsen (2012)</text>
<line x1="40" y1="230" x2="290" y2="230" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<text x="40" y="252" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">当互联网让大规模协作成为可能，科学</tspan>
  <tspan x="40" dy="18">发现的范式被重写。Nielsen 用 EMBL、</tspan>
  <tspan x="40" dy="18">Wikipathways、Foldit 等案例证明：网</tspan>
  <tspan x="40" dy="18">络化科学不是把旧流程搬上网，而是催</tspan>
  <tspan x="40" dy="18">生一种新的知识生产制度——这正是开源</tspan>
  <tspan x="40" dy="18">作为协作基础设施在科学领域的镜像。</tspan>
</text>

<rect x="40" y="432" width="95" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="87" y="445" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="460" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 网络化科学（Networked Science）</tspan>
  <tspan x="40" dy="17">• 集体智慧与开放科学</tspan>
  <tspan x="40" dy="17">• 协作作为知识生产范式</tspan>
</text>

<text x="540" y="430" text-anchor="middle" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" font-style="italic" fill="#1B3B6B" opacity="0.45" letter-spacing="0.5">
  <tspan x="540" dy="0">科学不是</tspan>
  <tspan x="540" dy="13">少数英雄</tspan>
  <tspan x="540" dy="13">的独奏，</tspan>
  <tspan x="540" dy="13">是网络的</tspan>
  <tspan x="540" dy="13">合奏。</tspan>
</text>
<text x="540" y="555" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="7" fill="#1B3B6B" opacity="0.35">— Nielsen · 适兕注</text>

<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之道·荐书</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
