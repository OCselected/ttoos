<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<rect x="0" y="795" width="600" height="4" fill="#1B3B6B"/>

<!-- ===== 左侧内容区 (0-390) ===== -->
<rect x="30" y="65" width="62" height="22" rx="3" fill="#1B3B6B"/>
<text x="61" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-08-02</text>

<text x="30" y="130" font-family="Georgia, Songti SC, serif" font-size="26" font-weight="700" fill="#1A1A1A">
  <tspan x="30" dy="0">Coding</tspan>
  <tspan x="30" dy="32">Freedom</tspan>
</text>
<text x="30" y="204" font-family="Songti SC, Noto Serif CJK SC, STSong, serif" font-size="15" font-weight="600" fill="#1A1A1A">
  <tspan x="30" dy="0">编码的自由：黑客的伦理与审美</tspan>
</text>
<text x="30" y="240" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">E. Gabriella Coleman · Princeton · 2012</text>
<line x1="30" y1="258" x2="250" y2="258" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>

<text x="30" y="284" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">当经济学家用激励解释开源时，</tspan>
  <tspan x="30" dy="19">Coleman 走进黑客的田野。她用人类</tspan>
  <tspan x="30" dy="19">学的眼睛发现：黑客不仅写代码，更</tspan>
  <tspan x="30" dy="19">在实践一种将自由、透明与审美合</tspan>
  <tspan x="30" dy="19">一为一的道德传统——自由不是"拥</tspan>
  <tspan x="30" dy="19">有"，而是"不被限制地创造与协作"。</tspan>
</text>

<rect x="30" y="458" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="75" y="471" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="30" y="504" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="30" dy="0">• 黑客伦理作为道德实践</tspan>
  <tspan x="30" dy="18">• "自由"的双重含义：free vs libre</tspan>
  <tspan x="30" dy="18">• 去政治化的政治</tspan>
  <tspan x="30" dy="18">• 审美化的代码生产</tspan>
</text>

