<rect x="450" y="352" width="7" height="7" fill="#1B3B6B" opacity="0.07" transform="rotate(45, 453, 355)"/>

<text x="415" y="430" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="442" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#555555">
  <tspan x="415" dy="0">代</tspan>
  <tspan x="415" dy="16">码</tspan>
  <tspan x="415" dy="16">不</tspan>
  <tspan x="415" dy="16">仅</tspan>
  <tspan x="415" dy="16">是</tspan>
  <tspan x="415" dy="16">工</tspan>
  <tspan x="415" dy="16">具</tspan>
  <tspan x="415" dy="16">，</tspan>
  <tspan x="415" dy="16">它</tspan>
  <tspan x="415" dy="16">是</tspan>
  <tspan x="415" dy="16">道</tspan>
  <tspan x="415" dy="16">德</tspan>
  <tspan x="415" dy="16">与</tspan>
  <tspan x="415" dy="16">审</tspan>
  <tspan x="415" dy="16">美</tspan>
</text>
<text x="415" y="558" font-family="Georgia, Songti SC, serif" font-size="10" fill="#1A1A1A" opacity="0.3">
  <tspan x="415" dy="0">"</tspan>
</text>
<text x="415" y="570" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="7" fill="#555555">
  <tspan x="415" dy="0">— E.G. Coleman 2012</tspan>
</text>

