<text x="76" y="85" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-11-07</text>
<text x="40" y="112" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="27" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Code:</tspan>
  <tspan x="40" dy="34">And Other Laws</tspan>
  <tspan x="40" dy="34">of Cyberspace</tspan>
</text>
<text x="40" y="212" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="19" font-weight="400" fill="#1B3B6B" opacity="0.85">
  <tspan x="40" dy="0">Version 2.0</tspan>
</text>
<text x="40" y="242" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Lawrence Lessig (2006) · Basic Books</text>
<line x1="40" y1="342" x2="222" y2="342" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="366" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">代码不是法律的对立面，它是另一种法律。</tspan>
  <tspan x="40" dy="20">法律、规范、市场、架构四样东西共同约束</tspan>
  <tspan x="40" dy="20">一个人的行为，而架构最难被看见、也最难</tspan>
  <tspan x="40" dy="20">被抵抗。当规则搬进软件，谁写代码谁立法。</tspan>
</text>
<rect x="40" y="470" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="483" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="509" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 四种规制模态：法律、规范、市场、架构</tspan>
  <tspan x="40" dy="18">• 可规制性是可以被设计出来的</tspan>
  <tspan x="40" dy="18">• 开源 = 控制可见，不是控制消失</tspan>
</text>
<text x="465" y="531" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="9" fill="#1B3B6B" opacity="0.40">
  <tspan x="465" dy="0">代</tspan>
  <tspan x="465" dy="11">码</tspan>
  <tspan x="465" dy="11">即</tspan>
  <tspan x="465" dy="11">法</tspan>
  <tspan x="465" dy="11">律</tspan>
</text>
<text x="465" y="660" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="8" fill="#1B3B6B" opacity="0.30">— Lawrence Lessig</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OPEN SOURCE · 荐书</text>
