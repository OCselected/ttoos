<circle cx="560" cy="40" r="80" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.10"/>
<rect x="20" y="90" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="2" opacity="0.10" transform="rotate(15, 27, 97)"/>
<rect x="40" y="65" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">BOOK</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-19</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="26" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Working in Public:</tspan>
  <tspan x="40" dy="34">The Making and</tspan>
  <tspan x="40" dy="34">Maintenance of Open</tspan>
  <tspan x="40" dy="34">Source Software</tspan>
</text>
<text x="40" y="251" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Nadia Eghbal (2020)</text>
<line x1="40" y1="279" x2="222" y2="279" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="301" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">Eghbal</tspan>
  <tspan x="40" dy="20">以人类学家的视角深入开源世界，揭示了</tspan>
  <tspan x="40" dy="20">一个被忽视的核心悖论：开源软件被数十</tspan>
  <tspan x="40" dy="20">亿人使用，却由寥寥数人维护。她将开源</tspan>
  <tspan x="40" dy="20">项目分为四种类型——联邦、俱乐部、玩具</tspan>
  <tspan x="40" dy="20">、体育场——并论证：开源是理解整个在线</tspan>
  <tspan x="40" dy="20">创作者经济的原型。这不是一本如何做开</tspan>
</text>
<rect x="40" y="463" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="476" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="491" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 平台化开源</tspan>
  <tspan x="40" dy="18">• 维护者危机</tspan>
  <tspan x="40" dy="18">• 创作者经济</tspan>
</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之书·共读</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
